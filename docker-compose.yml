services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-meu_valor_liquido}
      POSTGRES_USER: ${POSTGRES_USER:-meu_valor_liquido}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-local}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"
    restart: unless-stopped

  webapp:
    build:
      context: .
      dockerfile: infra/docker/WebApp.Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=${POSTGRES_DB:-meu_valor_liquido};Username=${POSTGRES_USER:-meu_valor_liquido};Password=${POSTGRES_PASSWORD:-change-me-local}
      Site__BaseUrl: ${SITE_BASE_URL:-http://localhost:8080}
      Mail__Host: mailpit
      Mail__Port: 1025
      Mail__FromAddress: noreply@meuvalorliquido.local
      Mail__FromName: Meu Valor Líquido
    ports:
      - "${WEBAPP_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
    restart: unless-stopped

volumes:
  postgres-data:
