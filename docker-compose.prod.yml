# Produção: PostgreSQL + WebApp (sem Mailpit).
# Uso: docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-meu_valor_liquido}
      POSTGRES_USER: ${POSTGRES_USER:-meu_valor_liquido}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  webapp:
    build:
      context: .
      dockerfile: infra/docker/WebApp.Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=${POSTGRES_DB:-meu_valor_liquido};Username=${POSTGRES_USER:-meu_valor_liquido};Password=${POSTGRES_PASSWORD}
      Site__BaseUrl: ${SITE_BASE_URL:?defina SITE_BASE_URL com https://}
      Ads__Enabled: ${ADS_ENABLED:-false}
      Mail__Host: ${MAIL_HOST:?defina MAIL_HOST}
      Mail__Port: ${MAIL_PORT:-587}
      Mail__UseSsl: ${MAIL_USE_SSL:-true}
      Mail__UserName: ${MAIL_USER:-}
      Mail__Password: ${MAIL_PASSWORD:-}
      Mail__FromAddress: ${MAIL_FROM_ADDRESS:-noreply@meuvalorliquido.com.br}
      Mail__FromName: ${MAIL_FROM_NAME:-Meu Valor Líquido}
    ports:
      - "${WEBAPP_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
