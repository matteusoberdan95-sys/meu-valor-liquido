name: ci

on:
  push:
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore MeuValorLiquido.slnx
      - run: dotnet build MeuValorLiquido.slnx --no-restore
      - run: dotnet test MeuValorLiquido.slnx --no-build --filter "FullyQualifiedName!~Playwright"

  playwright:
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore MeuValorLiquido.slnx
      - run: dotnet build MeuValorLiquido.slnx --no-restore
      - name: Install Playwright browsers
        run: bash tests/MeuValorLiquido.Playwright.Tests/bin/Debug/net10.0/playwright.sh install --with-deps chromium
      - run: dotnet test tests/MeuValorLiquido.Playwright.Tests/MeuValorLiquido.Playwright.Tests.csproj --no-build

  docker-build:
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v5
      - run: docker build -f infra/docker/WebApp.Dockerfile -t meu-valor-liquido:ci .
