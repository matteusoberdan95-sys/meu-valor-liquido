name: ci

on:
  push:
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore MeuValorLiquido.slnx
      - run: dotnet build MeuValorLiquido.slnx --no-restore
      - run: dotnet test MeuValorLiquido.slnx --no-build

  docker-build:
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v5
      - run: docker build -f infra/docker/WebApp.Dockerfile -t meu-valor-liquido:ci .
